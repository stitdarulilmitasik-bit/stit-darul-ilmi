name: Deploy Laravel to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, gd, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Remove stale Laravel package cache
        run: |
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build Vite assets
        run: |
          npm ci
          npm run build

      - name: Prepare deployment directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p storage/app/public
          mkdir -p bootstrap/cache

      - name: Deploy files by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            !.env.example
            **/siakadPT.sql
            **/.docker_backup/**
            **/tests/**
            **/phpunit.xml
            **/README.md
            **/INFINITYFREE_DEPLOYMENT.md
            **/package-lock.json
            **/package.json
            **/vite.config.js
